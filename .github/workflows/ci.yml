name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Validate dataset integrity
        run: |
          python -c "from data.loaders.validator import DataValidator; print('Validator module loaded')"

      - name: Run Test Suite
        run: |
          pytest -v tests/

      - name: Verify Power Flow Simulation Convergence
        run: |
          python -c "from grid.network_builder import DERNetworkBuilder; from grid.power_flow import PowerFlowEngine; net = DERNetworkBuilder().build_network(); res = PowerFlowEngine.run_power_flow(net); assert res['converged'], 'Power flow failed to converge'"
